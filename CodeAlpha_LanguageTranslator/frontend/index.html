<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CodeAlpha Language Translator</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="container">

        <header>
            <h1>🌐 Language Translator</h1>

            <p>
                Translate text between different languages
            </p>
        </header>


        <div class="translator-card">

            <!-- Language Selection -->

            <div class="language-section">

                <div class="language-box">

                    <label for="sourceLanguage">
                        From
                    </label>

                    <select id="sourceLanguage">

                        <option value="auto">
                            Auto Detect
                        </option>

                        <option value="en">
                            English
                        </option>

                        <option value="bn">
                            Bangla
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                    </select>

                </div>


                <button
                    id="swapBtn"
                    class="swap-btn"
                    title="Swap Languages"
                >
                    ⇄
                </button>


                <div class="language-box">

                    <label for="targetLanguage">
                        To
                    </label>

                    <select id="targetLanguage">

                        <option value="bn">
                            Bangla
                        </option>

                        <option value="en">
                            English
                        </option>

                        <option value="es">
                            Spanish
                        </option>

                        <option value="fr">
                            French
                        </option>

                        <option value="de">
                            German
                        </option>

                        <option value="hi">
                            Hindi
                        </option>

                    </select>

                </div>

            </div>


            <!-- Translation Area -->

            <div class="translation-area">

                <!-- Input -->

                <div class="text-box">

                    <label for="inputText">
                        Enter Text
                    </label>

                    <textarea
                        id="inputText"
                        placeholder="Type your text here..."
                    ></textarea>

                </div>


                <!-- Output -->

                <div class="text-box">

                    <label>
                        Translation
                    </label>

                    <div
                        id="translatedText"
                        class="translation-result"
                    >
                        Translation will appear here...
                    </div>

                </div>

            </div>


            <!-- Loading -->

            <div id="loading">
                🔄 Translating...
            </div>


            <!-- Translate Button -->

            <button
                id="translateBtn"
                class="translate-btn"
            >
                Translate
            </button>


            <!-- Copy Button -->

            <button
                id="copyBtn"
                class="copy-btn"
            >
                📋 Copy Translation
            </button>

        </div>


        <footer>

            <p>
                CodeAlpha Internship Project
            </p>

            <p>
                Built with HTML, CSS, JavaScript,
                Node.js & Express
            </p>

        </footer>

    </div>


    <script src="script.js"></script>

</body>

</html>
